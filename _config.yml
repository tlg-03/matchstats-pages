# GitHub Pages builds this repo with Jekyll (the legacy build, from main, /). The pages have no
# front matter, so they are served byte for byte. Only the pages are served: everything else that
# is tracked is listed here. Jekyll skips names starting with "." or "_" (.mailmap, .gitignore,
# this file), except .htaccess and the posts in a _posts folder. An entry here also hides every
# path that starts with it: "tests" covers tests.html too. Keep the list on one line: make test
# reads it.
exclude: [Makefile, README.md, DEVELOPMENT.md, tests]
